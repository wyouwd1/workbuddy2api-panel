name: 同步上游

# 把 misakano7545/workbuddy2api-panel 的 main 合并到本 fork 的 main。
# 用 GitHub 官方的 merge-upstream API：由服务端执行合并，不做 git push，
# 因此不会撞上「GitHub App 缺少 workflows 权限」的写入保护
# （2026-11-18 起旧版 force push 一直失败，报 refusing to allow ... binaries.yml）。
# 本 fork 的本地提交只有本 workflow 文件；与上游冲突时先手工解决再重跑。

on:
  schedule:
    # 每 6 小时（UTC 17 分）：北京时间 02:17 / 08:17 / 14:17 / 20:17
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 同步上游 main（官方 merge-upstream）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resp=$(mktemp)
          code=$(curl -sS -o "$resp" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -d '{"branch":"main"}')
          cat "$resp"; echo
          case "$code" in
            200)
              echo "同步完成：merge_type=$(jq -r '.merge_type // "none"' "$resp")"
              echo "上游：$(jq -r '.base_branch // "-"' "$resp")"
              ;;
            409)
              echo "::error::与上游冲突，需要手工解决后重跑"
              exit 1
              ;;
            *)
              echo "::error::merge-upstream 失败（HTTP $code）"
              exit 1
              ;;
          esac
